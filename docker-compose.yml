version: '3.8'

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev

  backend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
    command: npm run dev

  intelligence-engine:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "${INTELLIGENCE_PORT:-8000}:8000"
    volumes:
      - ./intelligence-engine:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tracevault
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
